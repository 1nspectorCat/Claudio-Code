org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
# Kotlin daemon is a SEPARATE JVM: without this it inherits the machine's
# cp1251 and silently compiles UTF-8 sources into mojibake (v0.69 field bug —
# every in-APK Russian string turned into krakozyabry; network strings were fine).
kotlin.daemon.jvmargs=-Xmx1536m -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true
